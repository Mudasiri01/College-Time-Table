
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Time Table Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101827;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            padding: 60px 35px;
            text-align: center;
            background: #1c293b;
            border: 1px solid #34445c;
            border-radius: 18px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        p {
            color: #bdc9d9;
            font-size: 16px;
            line-height: 1.8;
        }

        h3 {
            color: #65adff;
            margin-top: 30px;
        }

        .technology {
            margin-top: 18px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📅</div>

        <h1>College Time Table Management System</h1>

        <p>
            A web-based system designed to simplify,
            organize and manage college timetables
            efficiently.
        </p>

        <h3>Final Year Project (FYP)</h3>

        <p class="technology">
            HTML | CSS | Bootstrap | JavaScript |
            Node.js | MongoDB
        </p>

    </div>

</body>
</html>
